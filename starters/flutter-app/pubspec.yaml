name: app_starter
description: "Starter for new Flutter apps: design tokens, style presets, adaptive navigation, state widgets, RTL, and design QA tests."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-400.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-600.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-800.ttf
          weight: 800
